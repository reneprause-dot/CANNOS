<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:#F8FAFC;color:#1E293B;font-size:13px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}
button,input,select,textarea{font-family:inherit}
/* Layout */
.lh{height:52px;background:#fff;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;flex-shrink:0;z-index:200}
.lb{display:flex;flex:1;overflow:hidden;min-height:0}
.ls{background:#172619;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transition:width .2s}
.ls.w{width:200px}.ls.n{width:48px}
.lm{display:flex;flex-direction:column;flex:1;overflow:hidden;min-width:0}
.lr{height:42px;background:#F1F5F9;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;padding:0 14px;gap:5px;flex-shrink:0;overflow-x:auto}
.lc{display:flex;flex:1;overflow:hidden}
.lv{flex:1;overflow-y:auto;padding:18px}
.lfb{background:#fff;border-left:1px solid #E2E8F0;overflow-y:auto;flex-shrink:0}
.lfb.o{width:230px}.lfb.c{width:0;overflow:hidden;border:none}
/* Header */
.hlo{display:flex;align-items:center;padding:0 14px;height:100%;border-right:1px solid #E2E8F0;cursor:pointer;flex-shrink:0;transition:min-width .2s}
.hlo.w{min-width:200px}.hlo.n{min-width:48px;padding:0 12px;justify-content:center}
.hlo img{height:30px;object-fit:contain}
.hse{flex:1;padding:0 14px}.hsw{position:relative;max-width:340px;width:100%}
.hsi{width:100%;height:30px;border:1px solid #E2E8F0;border-radius:15px;padding:0 10px 0 28px;font-size:12px;background:#F8FAFC;outline:none}
.hsi:focus{border-color:#10B981}
.hsic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#94A3B8;font-size:12px;pointer-events:none}
.hac{display:flex;align-items:center;padding:0 12px;gap:4px;flex-shrink:0}
.hib{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#64748B;font-size:14px;cursor:pointer;position:relative;transition:background .12s}
.hib:hover{background:#F8FAFC}
.hbdg{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#EF4444;border:1.5px solid #fff}
.hus{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;cursor:pointer}
.hus:hover{background:#F8FAFC}
.hav{width:28px;height:28px;border-radius:50%;background:#2E7D32;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
/* Sidebar */
.sbr{height:52px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;gap:8px}
.snv{flex:1;overflow-y:auto;padding:6px 0}
.sgb{width:100%;display:flex;align-items:center;gap:8px;padding:7px 12px;color:#9DC09E;font-size:12px;cursor:pointer;text-align:left;border:none;border-left:3px solid transparent;background:none;transition:all .13s}
.sgb:hover{background:#1F3521;color:#fff}.sgb.ap{color:#fff;background:rgba(46,125,50,.2);border-left-color:#10B981}
.sic{font-size:14px;flex-shrink:0;width:18px;text-align:center}.slb{flex:1;overflow:hidden;white-space:nowrap;text-align:left}
.sar{font-size:9px;transition:transform .2s;flex-shrink:0;color:#4A6B4C}.sar.o{transform:rotate(90deg)}
.sch{max-height:0;overflow:hidden;transition:max-height .25s}.sch.o{max-height:400px}
.sci{display:flex;align-items:center;padding:5px 12px 5px 38px;color:#4A6B4C;font-size:12px;cursor:pointer;border-left:3px solid transparent;transition:all .13s;white-space:nowrap}
.sci:hover{background:#1F3521;color:#9DC09E}.sci.ac{border-left-color:#10B981;color:#fff;background:rgba(16,185,129,.15)}
.ls.n .slb,.ls.n .sar,.ls.n .sch{display:none}
.ls.n .sgb{padding:9px 0;justify-content:center}.ls.n .sic{width:auto}.ls.n .sbr{justify-content:center;padding:0}
/* Ribbon */
.rb{display:flex;align-items:center;gap:5px;padding:4px 11px;border-radius:5px;font-size:12px;font-weight:500;border:1px solid transparent;color:#64748B;white-space:nowrap;cursor:pointer;background:none;transition:all .12s;flex-shrink:0}
.rb:hover{background:#E2E8F0;color:#1E293B}
.rb.pr{background:#2E7D32;color:#fff;border-color:#2E7D32}.rb.pr:hover{background:#1B5E20}
.rb.ac{background:#10B981;color:#fff}.rb.ou{border-color:#CBD5E1;background:#fff}.rb.ou:hover{background:#F8FAFC}
.rb.wa{background:#FEF3C7;border-color:#F59E0B;color:#92400E}
.rb.da{border-color:#EF4444;color:#EF4444;background:#FEF2F2}
.rsep{width:1px;height:22px;background:#E2E8F0;margin:0 3px;flex-shrink:0}
.rmod{font-size:11px;font-weight:600;color:#64748B;padding-right:12px;margin-right:6px;border-right:1px solid #E2E8F0;white-space:nowrap;flex-shrink:0}
.rbc{display:flex;align-items:center;gap:6px;font-size:12px;color:#64748B;flex:1;overflow:hidden}
.rbl{color:#10B981;cursor:pointer;white-space:nowrap}.rbl:hover{text-decoration:underline}
/* Badges */
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.bdg.g{background:#D1FAE5;color:#065F46}.bdg.a{background:#FEF3C7;color:#92400E}
.bdg.r{background:#FEE2E2;color:#991B1B}.bdg.b{background:#DBEAFE;color:#1E40AF}
.bdg.p{background:#E8F5E9;color:#1B5E20}.bdg.mu{background:#F3F4F6;color:#6B7280}
.bdg.pu{background:#F3E8FF;color:#6B21A8}
/* Cards */
.card{background:#fff;border:1px solid #E2E8F0;border-radius:8px;overflow:hidden;margin-bottom:14px}
.card:last-child{margin-bottom:0}
.chd{padding:10px 14px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.cttl{font-size:12.5px;font-weight:600;color:#1E293B}.cbd{padding:12px 14px}
/* Table */
.tbl{width:100%;border-collapse:collapse}
.tbl thead th{padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:.4px;background:#F8FAFC;border-bottom:2px solid #E2E8F0;white-space:nowrap}
.tr{border-bottom:1px solid #F1F5F9;cursor:pointer;transition:background .1s}
.tr:hover{background:#F8FAFC}.tr.sel{background:#F0FDF4}.tr td{padding:9px 12px;font-size:12px}
.tnr{font-weight:600;color:#2E7D32}
/* Forms */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.ff{display:flex;flex-direction:column;gap:4px}.fl{font-size:12px;font-weight:500;color:#374151}
.fv{padding:7px 10px;font-size:13px;color:#1E293B;border:1px solid #F1F5F9;border-radius:6px;background:#F8FAFC;min-height:35px;display:flex;align-items:center}
.fv.hi{font-weight:600}
.fi{width:100%;padding:7px 10px;font-size:13px;border:1px solid #E2E8F0;border-radius:6px;outline:none;background:#fff;color:#1E293B;transition:border-color .15s}
.fi:focus{border-color:#2E7D32;box-shadow:0 0 0 2px #E8F5E9}
.fs{width:100%;padding:6px 9px;border:1px solid #E2E8F0;border-radius:5px;font-size:12px;outline:none;background:#fff;appearance:none}
.fs:focus{border-color:#2E7D32}
/* Alerts */
.alt{border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.alt.r{background:#FEF2F2;border:1px solid #FCA5A5;border-left:4px solid #EF4444}
.alt.a{background:#FFFBEB;border:1px solid #FCD34D;border-left:4px solid #F59E0B}
.alt.g{background:#F0FDF4;border:1px solid #86EFAC;border-left:4px solid #10B981}
.alt.b{background:#EFF6FF;border:1px solid #BFDBFE;border-left:4px solid #3B82F6}
.alt-ttl{font-size:13px;font-weight:700;margin-bottom:2px}.alt-txt{font-size:12px;line-height:1.5;color:#374151}
.ib{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#1E40AF;display:flex;gap:8px;align-items:flex-start}
/* KPIs */
.kpi-g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:12px;position:relative;overflow:hidden;cursor:pointer;transition:all .13s}
.kpi:hover{box-shadow:0 3px 10px rgba(0,0,0,.08);transform:translateY(-1px)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi.g::before{background:#10B981}.kpi.a::before{background:#F59E0B}.kpi.r::before{background:#EF4444}.kpi.b::before{background:#3B82F6}.kpi.p::before{background:#2E7D32}
.kpi-v{font-size:20px;font-weight:700;color:#1E293B;margin:6px 0 3px}
.kpi-l{font-size:10px;color:#64748B;text-transform:uppercase;letter-spacing:.4px}
.kpi-s{font-size:11px;color:#64748B;margin-top:4px}
/* Tabs */
.tabs{display:flex;border-bottom:1px solid #E2E8F0;margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 16px;font-size:12.5px;border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;color:#64748B;white-space:nowrap;transition:all .13s}
.tab.ac{color:#2E7D32;border-bottom-color:#2E7D32;font-weight:600}
/* Factbox */
.fb-hd{padding:10px 14px 8px;border-bottom:1px solid #E2E8F0;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.fb-sec{padding:10px 14px;border-bottom:1px solid #E2E8F0}
.fb-st{font-size:10px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.fb-row{display:flex;justify-content:space-between;align-items:center;padding:2.5px 0;font-size:12px;gap:6px}
.fb-rl{color:#64748B;flex-shrink:0}.fb-rv{font-weight:500;text-align:right}
/* Modal */
.mo{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.mo-box{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mo-hd{padding:16px 20px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mo-body{flex:1;overflow-y:auto;padding:20px}
.mo-ft{padding:14px 20px;border-top:1px solid #E2E8F0;display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
/* Toast */
.toast{position:fixed;bottom:20px;right:20px;z-index:1000;display:flex;align-items:center;gap:8px;border-radius:7px;padding:10px 16px;font-size:12px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.1);animation:sU .2s ease;max-width:420px}
@keyframes sU{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.kb-col{flex-shrink:0;width:240px;background:#F8FAFC;border-radius:8px;border:1px solid #E2E8F0;display:flex;flex-direction:column}
.kb-hd{padding:10px 12px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between}
.kb-body{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:80px}
.kb-card{background:#fff;border:1px solid #E2E8F0;border-radius:6px;padding:10px;cursor:pointer;transition:all .13s;border-left:3px solid}
.kb-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);transform:translateY(-1px)}
/* FEFO */
.fefo-pos{border:1px solid #E2E8F0;border-radius:8px;padding:12px;margin-bottom:10px;background:#F8FAFC}
.fefo-pos.ok{border-color:#B8D9BF;background:#F0FDF4}
.fefo-pos.warn{border-color:#FCD34D;background:#FFFBEB}
/* Misc */
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.bar-bg{background:#F1F5F9;border-radius:4px;height:8px;overflow:hidden;flex:1}
.bar-fill{height:100%;border-radius:4px}
.step-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.mp{display:flex;flex-direction:column;align-items:center;justify-content:center;height:240px;color:#64748B;gap:10px;font-size:14px}
.link{color:#10B981;cursor:pointer;text-decoration:none}.link:hover{text-decoration:underline}
.sct{font-size:11px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px;padding-bottom:6px;border-bottom:1px solid #F1F5F9}
/* Gantt */
.gantt-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #F1F5F9}
.gantt-lbl{width:150px;font-size:11px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-bg{flex:1;background:#F1F5F9;border-radius:3px;height:18px;overflow:hidden;position:relative}
.gantt-bar{height:100%;border-radius:3px;display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:600;color:#fff;white-space:nowrap;position:absolute}
/* BOM */
.bom-row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #F1F5F9;font-size:12px}
/* Dashboard chart */
.chart-bar{display:flex;align-items:flex-end;gap:8px;height:80px;padding:0 4px}
.chart-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.chart-bar-inner{width:100%;border-radius:3px 3px 0 0;min-height:4px;transition:height .3s}
.chart-lbl{font-size:10px;color:#64748B}
</style></head>

function fmt(n){return'€ '+Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtN(n,d=0){return Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});}
function art(id){return DB.artikel.find(a=>a.id===id)||{bez:'?',einheit:'?',btm:false};}
function kd(id){return DB.kunden.find(k=>k.id===id)||{firma:'?',sperre:false,lizenz_ok:true};}
function lief(id){return DB.lieferanten.find(l=>l.id===id)||{firma:'?'};}
function charge(id){return DB.chargen.find(c=>c.id===id)||{};}
function vaGesamt(va){return (va.zeilen||[]).reduce((s,z)=>s+z.menge*(z.vk||0),0);}
function bestandFuerArtikel(art_id){
  return DB.chargen.filter(c=>c.art_id===art_id&&c.status==='FREIGEGEBEN').reduce((s,c)=>s+c.menge,0);
}
function statusBdg(s){
  const m={ENTWURF:'b',FREIGEGEBEN:'g',GELIEFERT:'g',GEBUCHT:'g',ABGESCHLOSSEN:'g',PROTOKOLLIERT:'g',BEZAHLT:'g',GEWONNEN:'g',AKTIV:'g',FERTIG:'g',
    QUARANTAENE:'a',TEILGELIEFERT:'a',IN_BEARBEITUNG:'b',IN_PRODUKTION:'a',BALD_FAELLIG:'a',VERSANDT:'a',NEU:'b',GEPLANT:'b',QUALIFIZIERT:'a',
    GESPERRT:'r',STORNIERT:'r',ABGELAUFEN:'r',UEBERFAELLIG:'r',VERLOREN:'r',
    BESTELLT:'b',OFFEN:'a'};
  const n={QUARANTAENE:'Quarantäne',IN_BEARBEITUNG:'In Bearbeitung',IN_PRODUKTION:'In Produktion',UEBERFAELLIG:'Überfällig'};
  return`<span class="bdg ${m[s]||'mu'}">${n[s]||s}</span>`;
}
function toastEl(){
  if(!S.toast)return'';
  const{msg,type}=S.toast;
  const st={success:["#D1FAE5","#065F46","✓"],info:["#DBEAFE","#1E40AF","ℹ"],error:["#FEE2E2","#991B1B","⚠"],warning:["#FEF3C7","#92400E","⚠"]};
  const[bg,col,ico]=st[type]||st.success;
  return`<div class="toast" style="background:${bg};color:${col};border:1px solid ${col}30"><span>${ico}</span>${msg}</div>`;
}

/** WE-Buchung: Charge anlegen (Quarantäne), BtM-Eintrag, Bestellung aktualisieren */
function bucheWareneingang(ebId, weZeilen){
  const eb=DB.ek_bestellungen.find(e=>e.id===ebId);
  if(!eb){toast('Bestellung nicht gefunden','error');return;}
  const weNr='WE-2026-0'+String(++DB._counters.WE).padStart(3,'0');
  const neueChargen=[];
  const neueBtm=[];
  weZeilen.forEach(z=>{
    const a=art(z.art_id);
    const cNr='B-2026-0'+String(50+DB.chargen.length).padStart(2,'0');
    const cId='C_'+Date.now()+'_'+z.art_id;
    const neueCharge={id:cId,nr:cNr,art_id:z.art_id,thc_ist:z.thc_ist||0,mhd:z.mhd||'2027-12-31',menge:z.menge,menge_orig:z.menge,lager:'QR-01',status:'QUARANTAENE',coa:z.coa||'COA-NEU',labor:z.labor||'Labor',qp:null,freiDat:null,we_id:'WE_'+weNr};
    DB.chargen.push(neueCharge);
    neueChargen.push(neueCharge);
    if(a.btm){
      const maxId=Math.max(...DB.btm_buch.map(b=>b.id));
      const saldo=DB.btm_buch.filter(b=>b.art_id===z.art_id).sort((x,y)=>y.id-x.id)[0]?.saldo||0;
      DB.btm_buch.push({id:maxId+1,dat:'2026-07-22',typ:'ZUGANG',art_id:z.art_id,menge:z.menge,eh:a.einheit,beleg:weNr,charge_id:cId,saldo:saldo+z.menge,auto:true});
    }
  });
  DB.wareneingaenge.push({id:'WE_'+weNr,nr:weNr,eb_id:ebId,dat:'2026-07-22',status:'GEBUCHT',zeilen:weZeilen.map(z=>({art_id:z.art_id,charge_id:neueChargen.find(c=>c.art_id===z.art_id)?.id,menge:z.menge}))});

/** QM-Freigabe: Charge-Status ändern, BtM-Eintrag falls nötig */
function erteileQMFreigabe(chargeId, entscheidung, begruendung){
  const idx=DB.chargen.findIndex(c=>c.id===chargeId);
  if(idx<0){toast('Charge nicht gefunden','error');return;}
  const c=DB.chargen[idx];
  const a=art(c.art_id);
  DB.chargen[idx].status=entscheidung;
  DB.chargen[idx].qp='René Prause';
  DB.chargen[idx].freiDat='2026-07-22';
  if(entscheidung==='FREIGEGEBEN'){
    // Lager von QR nach HL verschieben
    DB.chargen[idx].lager='HL-01';
    toast(`Charge ${c.nr} freigegeben ✓ → Lager: HL-01`,'success');
  } else if(entscheidung==='GESPERRT'){
    toast(`Charge ${c.nr} gesperrt – Lager SP-01`,'warning');
    DB.chargen[idx].lager='SP-01';
  } else if(entscheidung==='VERNICHTET'){
    if(a.btm){
      const maxId=Math.max(...DB.btm_buch.map(b=>b.id));
      const saldo=DB.btm_buch.filter(b=>b.art_id===c.art_id).sort((x,y)=>y.id-x.id)[0]?.saldo||0;
      DB.btm_buch.push({id:maxId+1,dat:'2026-07-22',typ:'VERNICHTUNG',art_id:c.art_id,menge:c.menge,eh:a.einheit,beleg:'VP-AUTO',charge_id:chargeId,saldo:Math.max(0,saldo-c.menge),auto:true});
    }
    DB.chargen[idx].menge=0;
    toast(`Charge ${c.nr} vernichtet – BtM-Buchung erstellt`,'warning');
  }
  set({modal:null});
}

/** FEFO-Automat: Chargen nach MHD sortieren, Menge aufteilen */
function fefoBerechne(va){
  return (va.zeilen||[]).map(z=>{
    const a=art(z.art_id);
    const freiChargen=DB.chargen
      .filter(c=>c.art_id===z.art_id&&c.status==='FREIGEGEBEN'&&c.menge>0)
      .sort((a,b)=>new Date(a.mhd)-new Date(b.mhd));
    let rest=z.menge; const verw=[];
    for(const c of freiChargen){if(rest<=0)break;const g=Math.min(c.menge,rest);verw.push({c,menge:g});rest-=g;}
    return{z,a,verw,fehlend:rest,ok:rest===0};
  });
}

/** LS-Buchung: FEFO, BtM-Abgang, VK-Rechnung, Debitor */
function bucheLieferschein(vaId){
  const va=DB.vk_auftraege.find(v=>v.id===vaId);
  const k=kd(va.kd_id);
  if(!va||k.sperre||!k.lizenz_ok){toast('Buchung nicht möglich (Sperre/Lizenz)','error');return;}
  const fefo=fefoBerechne(va);
  if(!fefo.every(p=>p.ok)){toast('Nicht alle Positionen vollständig verfügbar','error');return;}
  const lsNr='LS-2026-0'+String(++DB._counters.LS).padStart(2,'0');
  const vrNr='VK-2026-0'+String(++DB._counters.VR).padStart(3,'0');
  const gesamt=vaGesamt(va);
  // Chargen-Bestände reduzieren
  const chargenVerwendet=[];
  fefo.forEach(pos=>{
    pos.verw.forEach(v=>{
      const idx=DB.chargen.findIndex(c=>c.id===v.c.id);
      if(idx>=0)DB.chargen[idx].menge-=v.menge;
      chargenVerwendet.push({art_id:pos.z.art_id,charge_id:v.c.id,menge:v.menge});
      if(pos.a.btm){
        const maxId=Math.max(...DB.btm_buch.map(b=>b.id));
        const saldo=DB.btm_buch.filter(b=>b.art_id===pos.z.art_id).sort((x,y)=>y.id-x.id)[0]?.saldo||0;
        DB.btm_buch.push({id:maxId+1,dat:'2026-07-22',typ:'ABGANG',art_id:pos.z.art_id,menge:v.menge,eh:pos.a.einheit,beleg:lsNr,charge_id:v.c.id,saldo:Math.max(0,saldo-v.menge),auto:true});
      }
    });
  });
  DB.lieferscheine.push({id:'LS_'+lsNr,nr:lsNr,va_id:vaId,dat:'2026-07-22',status:'GEBUCHT',gesamt,chargen_verwendet:chargenVerwendet});
  DB.vk_rechnungen.push({id:'VR_'+vrNr,nr:vrNr,ls_id:'LS_'+lsNr,kd_id:va.kd_id,dat:'2026-07-22',faellig:'2026-08-21',status:'OFFEN',betrag:gesamt});
  DB.buchungen.push({id:Math.max(...DB.buchungen.map(b=>b.id))+1,dat:'2026-07-22',belnr:vrNr,soll:k.debkto,haben:'40000',betrag:gesamt,text:'VK-Rechnung '+k.firma,typ:'AUSGANGSRECHNUNG'});
  const vaIdx=DB.vk_auftraege.findIndex(v=>v.id===vaId);
  if(vaIdx>=0)DB.vk_auftraege[vaIdx].status='GELIEFERT';
  toast(`✓ ${lsNr} gebucht | ${vrNr} angelegt | FEFO-Abgänge + BtM-Buch ✓`,'success');
  set({lsMaske:false,lsStep:1,lsResult:{lsNr,vrNr,gesamt},vaDetail:DB.vk_auftraege[vaIdx]||null,vaTab:'lieferungen'});
}

/** Umlagerung: Lagerplatz-Wechsel + BtM-Buchung */
function bucheUmlagerung(chargeId, vonLager, nachLager, menge, grund){
  const idx=DB.chargen.findIndex(c=>c.id===chargeId);
  if(idx<0){toast('Charge nicht gefunden','error');return;}
  const c=DB.chargen[idx];
  const a=art(c.art_id);
  if(c.menge<menge){toast('Nicht genug Bestand in Quelllager','error');return;}
  DB.chargen[idx].lager=nachLager;
  DB.umlagerungen.push({id:'UL_'+Date.now(),nr:'UML-2026-0'+String(++DB._counters.UML).padStart(2,'0'),dat:'2026-07-22',art_id:c.art_id,charge_id:chargeId,menge,von:vonLager,nach:nachLager,grund,status:'GEBUCHT'});
  if(a.btm){
    const maxId=Math.max(...DB.btm_buch.map(b=>b.id));
    DB.btm_buch.push({id:maxId+1,dat:'2026-07-22',typ:'UMBUCHUNG',art_id:c.art_id,menge,eh:a.einheit,beleg:'UML-AUTO',charge_id:chargeId,saldo:DB.btm_buch.filter(b=>b.art_id===c.art_id).sort((x,y)=>y.id-x.id)[0]?.saldo||0,auto:true});
  }
  toast(`Umlagerung gebucht: ${c.nr} → ${nachLager}`,'success');
}

/** FA-Abschluss: BtM-Verbrauch buchen */
function bucheFAAbschluss(faId){
  const idx=DB.fertigungsauftraege.findIndex(f=>f.id===faId);
  if(idx<0){toast('FA nicht gefunden','error');return;}
  const fa=DB.fertigungsauftraege[idx];
  const sbl=DB.stuecklisten.find(s=>s.id===fa.sbl_id);
  DB.fertigungsauftraege[idx].status='FERTIG';
  DB.fertigungsauftraege[idx].fortschritt=100;
  if(sbl){
    sbl.komponenten.filter(k=>k.btm&&k.art_id).forEach(k=>{
      const verbrauch=k.menge*fa.menge;
      const maxId=Math.max(...DB.btm_buch.map(b=>b.id));
      const saldo=DB.btm_buch.filter(b=>b.art_id===k.art_id).sort((x,y)=>y.id-x.id)[0]?.saldo||0;
      DB.btm_buch.push({id:maxId+1,dat:'2026-07-22',typ:'FA-VERBRAUCH',art_id:k.art_id,menge:verbrauch,eh:art(k.art_id).einheit,beleg:fa.nr,charge_id:'FA-CHARGE',saldo:Math.max(0,saldo-verbrauch),auto:true});
      // Chargenbestand reduzieren (FEFO aus freigegebenen Chargen)
      let rest=verbrauch;
      DB.chargen.filter(c=>c.art_id===k.art_id&&c.status==='FREIGEGEBEN'&&c.menge>0).sort((a,b)=>new Date(a.mhd)-new Date(b.mhd)).forEach(c=>{
        if(rest<=0)return;
        const g=Math.min(c.menge,rest);
        const cIdx=DB.chargen.findIndex(x=>x.id===c.id);
        DB.chargen[cIdx].menge-=g;rest-=g;
      });
    });
  }
  toast(`FA ${fa.nr} abgeschlossen – BtM-Verbrauch in BtM-Buch gebucht ✓`,'success');
}

      <div style="font-size:10px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px">FEFO-Chargenauswahl:</div>
      ${pos.verw.map((v,j)=>`<div style="display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid #F8FAFC;font-size:11px">

  </div></div>
  <div style="display:flex;gap:10px">
    <button class="rb ou" onclick="nav('lieferscheine')">→ Lieferscheine</button>

function vBtmBilanz(){
  const bilanz=DB.artikel.filter(a=>a.btm).map(a=>{
    const bEntries=DB.btm_buch.filter(e=>e.art_id===a.id);
    const zu=bEntries.filter(e=>e.typ==='ZUGANG').reduce((s,e)=>s+e.menge,0);
    const ag=bEntries.filter(e=>e.typ==='ABGANG').reduce((s,e)=>s+e.menge,0);
    const vn=bEntries.filter(e=>e.typ==='VERNICHTUNG').reduce((s,e)=>s+e.menge,0);
    const fa=bEntries.filter(e=>e.typ==='FA-VERBRAUCH').reduce((s,e)=>s+e.menge,0);
    const bst=zu-ag-vn-fa;
    const real=bestandFuerArtikel(a.id);
    return{...a,zu,ag,vn,fa,bst,real,diff:real-bst};
  });
  return`<div class="ib">ℹ️ <span>BtM-Mengenbilanz: Soll aus <code>btm_buch_eintrag</code>-Saldo, Ist aus <code>artikel_charge.menge</code>-Summe · Datenquelle für Halbjahresmeldung</span></div>

/* ── 2. AUDIT-LOG FUNKTION (GoBD §146 – unveränderlich) ─── */
function logAudit(aktion, tabelle, datensatz_id, alteWerte, neueWerte) {
  DB.audit_log.unshift({
    id: Date.now(),
    ts: new Date().toISOString(),

    kz: 'RP',
    rolle: 'Admin · QP',
    qp_zert: 'QP-DE-2024-001',
    aktion,
    tabelle,
    datensatz_id: String(datensatz_id||''),
    alt: alteWerte ? JSON.stringify(alteWerte).substring(0,300) : null,
    neu: neueWerte ? JSON.stringify(neueWerte).substring(0,300) : null,
    ip: '192.168.1.100',

  });
  if(DB.audit_log.length > 1000) DB.audit_log.pop();
}

/* ── 3. SHA-256 VIA WEBCRYPTO API (GAMP 5 / §21 CFR 11) ── */
async function hashSHA256(payload) {
  try {
    const buf  = new TextEncoder().encode(JSON.stringify(payload));
    const hBuf = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  } catch(e) {
    // Deterministischer Fallback für non-HTTPS / Demo
    const s = JSON.stringify(payload);
    let h = 5381n;
    for(let i=0;i<s.length;i++) h=((h<<5n)+h+BigInt(s.charCodeAt(i)))&0xFFFFFFFFFFFFFFFFn;
    return 'DEMO-' + h.toString(16).padStart(16,'0') + Date.now().toString(16);
  }
}

/* ── 4. QM-FREIGABE OVERRIDE (SHA-256 + Audit + QP-Zert) ─ */
async function erteileQMFreigabe(chargeId, entscheidung, begruendung, qpZertNr) {
  const idx = DB.chargen.findIndex(c=>c.id===chargeId);
  if(idx<0){ toast('Charge nicht gefunden','error'); return; }
  const c  = DB.chargen[idx];
  const a  = art(c.art_id);
  const alt = { status:c.status, lager:c.lager, qp:c.qp };
  const zert = qpZertNr || 'QP-DE-2024-001';
  const ts   = new Date().toISOString();

  // SHA-256 Payload
  const payload = {
    charge_nr: c.nr, art_nr: a.nr, thc_ist: c.thc_ist,
    mhd: c.mhd, menge: c.menge, entscheidung, begruendung,
    qp: 'René Prause', qp_zert: zert, ts
  };
  const hash = await hashSHA256(payload);

  // Charge aktualisieren
  DB.chargen[idx].status       = entscheidung;
  DB.chargen[idx].qp           = 'René Prause';
  DB.chargen[idx].freiDat      = ts.substring(0,10);
  DB.chargen[idx].signatur_hash = hash;
  DB.chargen[idx].qp_zert_nr   = zert;

  if(entscheidung==='FREIGEGEBEN') {
    DB.chargen[idx].lager = 'HL-01';
    toast(`✓ Charge ${c.nr} freigegeben | SHA-256: ${hash.substring(0,16)}…`,'success');
  } else if(entscheidung==='GESPERRT') {
    DB.chargen[idx].lager = 'SP-01';
    toast(`⛔ ${c.nr} gesperrt | SHA-256: ${hash.substring(0,16)}…`,'warning');
  } else if(entscheidung==='VERNICHTET') {
    if(a.btm){
      const maxId = Math.max(...DB.btm_buch.map(b=>b.id));
      const saldo = DB.btm_buch.filter(b=>b.art_id===c.art_id).sort((x,y)=>y.id-x.id)[0]?.saldo||0;
      DB.btm_buch.push({id:maxId+1,dat:ts.substring(0,10),typ:'VERNICHTUNG',art_id:c.art_id,menge:c.menge,eh:a.einheit,beleg:'VP-AUTO-'+ts.substring(0,10),charge_id:chargeId,saldo:Math.max(0,saldo-c.menge),auto:true});
    }
    DB.chargen[idx].menge = 0;
    toast(`♻ ${c.nr} vernichtet | BtM-Buchung + SHA-256: ${hash.substring(0,16)}…`,'warning');
  }

  // E-Signatur speichern
  DB.e_signaturen.push({
    id: DB.e_signaturen.length+1,
    datensatz_typ: 'artikel_charge', datensatz_id: chargeId,
    bedeutung: entscheidung, hash_wert: hash, hash_algo: 'SHA-256',
    signiert_von: 'René Prause', qp_zert_nr: zert,
    signiert_am: ts, payload: JSON.stringify(payload)
  });

  // Audit-Log
  logAudit('QM_FREIGABE_'+entscheidung, 'artikel_charge', chargeId, alt,
    {status:entscheidung, signatur_hash: hash.substring(0,32)+'…', qp_zert_nr: zert});
  set({modal:null});
}

const _origBucheWE = bucheWareneingang;
function bucheWareneingang(ebId, weZeilen) {
  const result = _origBucheWE(ebId, weZeilen);
  logAudit('WE_GEBUCHT','wareneingang_kopf', result||ebId,
    {eb_id:ebId}, {we_nr:result, chargen:weZeilen.length});
  return result;
}

const _origBucheLS = bucheLieferschein;
function bucheLieferschein(vaId) {
  const vaBefore = DB.vk_auftraege.find(v=>v.id===vaId);
  _origBucheLS(vaId);
  const ls = DB.lieferscheine[DB.lieferscheine.length-1];
  logAudit('LS_GEBUCHT','lieferschein_kopf', ls?.id||vaId,
    {va_status: vaBefore?.status},
    {ls_nr: ls?.nr, vr_nr: DB.vk_rechnungen[DB.vk_rechnungen.length-1]?.nr});
}

const _origBucheUml = bucheUmlagerung;
function bucheUmlagerung(chargeId, von, nach, menge, grund) {
  _origBucheUml(chargeId, von, nach, menge, grund);
  logAudit('UMLAGERUNG_GEBUCHT','umlagerung_kopf', chargeId,
    {lager:von}, {lager:nach, menge, grund});
}

const _origBucheFA = bucheFAAbschluss;
function bucheFAAbschluss(faId) {
  const fa = DB.fertigungsauftraege.find(f=>f.id===faId);
  _origBucheFA(faId);
  logAudit('FA_ABGESCHLOSSEN','fertigungsauftrag', faId,
    {status:fa?.status}, {status:'FERTIG'});
}

function bucheEKRechnung(ebId, rechnungsNr, betrag, menge) {
  const eb=DB.ek_bestellungen.find(e=>e.id===ebId);if(!eb){toast('Bestellung nicht gefunden','error');return;}
  const we=DB.wareneingaenge.find(w=>w.eb_id===ebId);
  const l=lief(eb.lief_id);
  const bMg=(eb.zeilen||[]).reduce((s,z)=>s+z.menge,0);
  const wMg=we?(we.zeilen||[]).reduce((s,z)=>s+z.menge,0):0;
  const dreiOk=we&&Math.abs(wMg-menge)<=bMg*0.05;
  const ekrNr='EKR-2026-0'+String(++DB._counters.VK).padStart(3,'0');
  const ekr={id:'EKR_'+Date.now(),nr:ekrNr,eb_id:ebId,we_id:we?we.id:null,lief_id:eb.lief_id,rechnung_nr_lief:rechnungsNr,dat:'2026-07-22',faellig:'2026-08-21',betrag,menge,status:'OFFEN',dreiwege_ok:dreiOk,dreiwege_diff:we?wMg-menge:null};
  DB.ek_rechnungen.push(ekr);
  DB.buchungen.push({id:Math.max(...DB.buchungen.map(b=>b.id))+1,dat:'2026-07-22',belnr:ekrNr,soll:'60000',haben:l.kto,betrag,text:'EK-Rechnung '+l.firma+' ('+rechnungsNr+')',typ:'EINGANGSRECHNUNG'});
  logAudit('EK_RECHNUNG_GEBUCHT','ek_rechnung_kopf',ekr.id,{eb_id:ebId},{ekr_nr:ekrNr,betrag,dreiwege_ok:dreiOk});
  if(!dreiOk)toast('Achtung: 3-Wege-Abgleich Mengenabweichung WE:'+wMg+' vs. Rechnung:'+menge,'warning');
  else toast('EK-Rechnung '+ekrNr+' gebucht – 3-Wege OK','success');
  return ekr;
}

function bucheZahlungseingang(vrId, betrag) {
  const idx=DB.vk_rechnungen.findIndex(r=>r.id===vrId);if(idx<0){toast('Rechnung nicht gefunden','error');return;}
  const vr=DB.vk_rechnungen[idx];const k=kd(vr.kd_id);
  const zeNr='ZE-2026-0'+String(DB.bank_buchungen.length+1).padStart(3,'0');
  const s0=[...DB.bank_buchungen].sort((a,b)=>b.id-a.id)[0];
  const s1=s0?s0.saldo_nach:DB.bank_saldo_anfang;
  DB.bank_buchungen.push({id:DB.bank_buchungen.length+1,dat:'2026-07-22',typ:'EINGANG',kd_kto:k.debkto,betrag,text:'Zahlung '+k.firma+' zu '+vr.nr,beleg:zeNr,saldo_nach:s1+betrag});
  DB.vk_rechnungen[idx].status='BEZAHLT';
  DB.buchungen.push({id:Math.max(...DB.buchungen.map(b=>b.id))+1,dat:'2026-07-22',belnr:zeNr,soll:'12000',haben:k.debkto,betrag,text:'Zahlungseingang '+k.firma,typ:'ZAHLUNGSEINGANG'});

/* 2. LEAD → KUNDE KONVERTIEREN */
function konvertiereLeadZuKunde(leadId) {
  var lead = DB.leads.find(function(l){return l.id===leadId;});
  if(!lead){toast('Lead nicht gefunden','error');return;}
  if(lead.status==='KONVERTIERT'){toast('Lead bereits konvertiert','warning');return;}
  var kdNr = 'K-'+String(DB.kunden.length+1).padStart(5,'0');
  var debKto = String(10000+DB.kunden.length+1);
  var neuerKunde = {
    id:'KD_'+Date.now(), nr:kdNr,
    firma: lead.firma, ort: lead.ort,
    typ:'Apotheke', lizenz_ok:false, sperre:false,
    debkto: debKto, zkz:'30 Tage',
    lizenz_bis:'2027-12-31',
    lead_id: leadId, ansprechpartner: lead.kp
  };
  DB.kunden.push(neuerKunde);
  var li = DB.leads.findIndex(function(l){return l.id===leadId;});
  if(li>=0){DB.leads[li].status='KONVERTIERT';DB.leads[li].kd_id=neuerKunde.id;}
  logAudit('LEAD_KONVERTIERT','kunde',neuerKunde.id,{lead_status:lead.status},{kd_nr:kdNr,firma:lead.firma});
  toast('Lead '+lead.nr+' → Kunde '+kdNr+' ('+lead.firma+') angelegt – Lizenz ausstehend','success');
  set({view:'kunden',kdDetail:neuerKunde,kdTab:'stamm',openG:Object.assign({},S.openG,{stammdaten:true})});
}

/* 3. VK-GUTSCHRIFT BUCHEN */
function bucheVKGutschrift(vrId, grund, menge) {
  var vr = DB.vk_rechnungen.find(function(r){return r.id===vrId;});
  if(!vr){toast('VK-Rechnung nicht gefunden','error');return;}
  var k = kd(vr.kd_id);
  var ls = DB.lieferscheine.find(function(l){return l.id===vr.ls_id;});
  var gutNr = 'GU-2026-0'+String(DB.vk_gutschriften.length+1).padStart(3,'0');
  var betrag = menge ? (vr.betrag * menge / 100) : vr.betrag;

  // FEFO-Rückbuchung: Charge-Bestand erhöhen
  if(ls && ls.chargen_verwendet) {
    ls.chargen_verwendet.forEach(function(cv){
      var idx = DB.chargen.findIndex(function(c){return c.id===cv.charge_id;});
      if(idx>=0) {
        DB.chargen[idx].menge += cv.menge;
        var a = art(DB.chargen[idx].art_id);
        if(a.btm){
          var maxId = Math.max.apply(null,DB.btm_buch.map(function(b){return b.id;}));
          var sl = DB.btm_buch.filter(function(b){return b.art_id===a.id;}).sort(function(x,y){return y.id-x.id;})[0];
          DB.btm_buch.push({id:maxId+1,dat:'2026-07-22',typ:'GUTSCHRIFT-ZUGANG',art_id:a.id,menge:cv.menge,eh:a.einheit,beleg:gutNr,charge_id:cv.charge_id,saldo:(sl?sl.saldo:0)+cv.menge,auto:true});
        }
      }
    });
  }

  // Gutschrift anlegen
  DB.vk_gutschriften.push({id:'GU_'+Date.now(),nr:gutNr,vr_id:vrId,kd_id:vr.kd_id,dat:'2026-07-22',betrag:betrag,grund:grund,status:'GEBUCHT'});

  // FiBu Gegenbuchung
  DB.buchungen.push({id:Math.max.apply(null,DB.buchungen.map(function(b){return b.id;}))+1,dat:'2026-07-22',belnr:gutNr,soll:'40000',haben:k.debkto,betrag:betrag,text:'VK-Gutschrift zu '+vr.nr+' – '+grund,typ:'GUTSCHRIFT'});

  logAudit('VK_GUTSCHRIFT_GEBUCHT','vk_gutschrift',gutNr,{vr_id:vrId,betrag:vr.betrag},{gut_nr:gutNr,betrag:betrag,fefo_rueckbuchung:ls?true:false});
  toast('Gutschrift '+gutNr+' gebucht – FEFO-Rückbuchung + BtM-Gegenbuchung + FiBu','success');
}

function checkMindestbestand() {
  return DB.artikel.map(function(a){

}

  var erloese = buch.filter(function(b){return b.soll&&b.soll.startsWith('1')&&b.typ==='AUSGANGSRECHNUNG';}).reduce(function(s,b){return s+b.betrag;},0);
  var wareneinsatz = buch.filter(function(b){return b.soll==='60000';}).reduce(function(s,b){return s+b.betrag;},0);
  var zahlungseingaenge = buch.filter(function(b){return b.typ==='ZAHLUNGSEINGANG';}).reduce(function(s,b){return s+b.betrag;},0);
  var gutschriften = buch.filter(function(b){return b.typ==='GUTSCHRIFT';}).reduce(function(s,b){return s+b.betrag;},0);

/* 11. MAHNLAUF (vollständig) */
function runMahnlauf() {
  var heute = '2026-07-22';
  var neu = 0;
  DB.vk_rechnungen.forEach(function(vr){
    if(vr.status!=='OFFEN') return;
    if(vr.faellig >= heute) return;
    var k = kd(vr.kd_id);
    var bestehend = DB.mahnungen.find(function(m){return m.kd_id===vr.kd_id&&m.status!=='ABGESCHLOSSEN';});
    var stufe = bestehend ? Math.min(bestehend.stufe+1, 3) : 1;
    var mnr = 'MN-2026-0'+String(DB.mahnungen.length+1).padStart(3,'0');
    var gebuehr = stufe===1?0:stufe===2?5:15;
    if(bestehend) { bestehend.status='ABGESCHLOSSEN'; }
    DB.mahnungen.push({id:'MN_'+Date.now(),nr:mnr,kd_id:vr.kd_id,betrag:vr.betrag,stufe,dat:heute,faellig:vr.faellig,status:'NEU',gebuehr});
    if(gebuehr>0) {
      DB.buchungen.push({id:Math.max.apply(null,DB.buchungen.map(function(b){return b.id;}))+1,dat:heute,belnr:mnr,soll:k.debkto,haben:'49100',betrag:gebuehr,text:'Mahngebühr Stufe '+stufe+' – '+k.firma,typ:'MAHNUNG'});
    }
    logAudit('MAHNUNG_ERSTELLT','mahnung',mnr,{vr_id:vr.id},{stufe,betrag:vr.betrag,gebuehr});
    neu++;
  });
  toast('Mahnlauf abgeschlossen: '+neu+' neue Mahnung(en) erstellt','success');
  draw();
}

/* ── PAGINIERUNG ─────────────────────────────────────────── */
var PAGE_SIZE = 25;
if(!S.pages) S.pages = {};

function paginate(arr, key) {
  var pg = S.pages[key] || 1;
  var total = arr.length;
  var pages = Math.ceil(total / PAGE_SIZE);
  var start = (pg-1)*PAGE_SIZE;
  var items = arr.slice(start, start+PAGE_SIZE);
  return {items:items, pg:pg, pages:pages, total:total, start:start+1, end:Math.min(start+PAGE_SIZE,total)};
}

function pageBar(key, pages, pg, total) {
  if(pages<=1) return '';
  var out = '<div style="display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid #E2E8F0;font-size:12px;color:#64748B">';
  out += '<span>'+total+' Einträge · Seite '+pg+' von '+pages+'</span>';
  out += '<div style="flex:1"></div>';
  if(pg>1) out += '<button class="rb ou" style="font-size:11px;padding:2px 8px" onclick="var p=Object.assign({},S.pages);p[\''+key+'\']='+(pg-1)+';set({pages:p})">← Zurück</button>';
  // Seitenzahlen
  var start = Math.max(1,pg-2); var end = Math.min(pages,pg+2);
  for(var i=start;i<=end;i++) {
    out += '<button class="rb '+(i===pg?'pr':'ou')+'" style="font-size:11px;padding:2px 8px;min-width:28px" onclick="var p=Object.assign({},S.pages);p[\''+key+'\']='+i+';set({pages:p})">'+i+'</button>';
  }
  if(pg<pages) out += '<button class="rb ou" style="font-size:11px;padding:2px 8px" onclick="var p=Object.assign({},S.pages);p[\''+key+'\']='+(pg+1)+';set({pages:p})">Weiter →</button>';
  out += '</div>';
  return out;
}

/* ── MHD-ABLAUF-VORSCHAU ─────────────────────────────────── */
function getMHDVorschau(tage) {
  var today = new Date('2026-07-22');
  var limit = new Date('2026-07-22');
  limit.setDate(limit.getDate() + (tage||90));
  return DB.chargen.filter(function(c){
    if(c.menge<=0) return false;
    var mhd = new Date(c.mhd);
    return mhd >= today && mhd <= limit;
  }).sort(function(a,b){return new Date(a.mhd)-new Date(b.mhd);});
}

/* ── INVENTUR-BUCHUNGSSATZ ───────────────────────────────── */
function bucheInventurDifferenz(inventurId, positionen) {
  // positionen: [{art_id, charge_id, soll, ist}]
  var inv = DB.inventuren.find(function(i){return i.id===inventurId;}) || {nr:'INV-DEMO',dat:'2026-07-22'};
  var buchungen = 0;
  positionen.forEach(function(p){
    var diff = p.ist - p.soll;
    if(Math.abs(diff) < 0.01) return;
    var a = art(p.art_id);
    var maxId = Math.max.apply(null, DB.buchungen.map(function(b){return b.id;}));
    // Inventurdifferenz: Soll 20400 (Bestandskorrekturen), Haben 20000 (Warenbestand) oder umgekehrt
    DB.buchungen.push({
      id: maxId+1,
      dat: inv.dat||'2026-07-22',
      belnr: inv.nr,
      soll: diff>0 ? '20000' : '20400',
      haben: diff>0 ? '20400' : '20000',
      betrag: Math.abs(diff) * (a.ek||7),
      text: 'Inventurdifferenz '+a.nr+' '+inv.nr+': '+(diff>0?'+':'')+diff+' '+a.einheit,
      typ: 'INVENTURDIFFERENZ'
    });
    // Chargenbestand korrigieren
    if(p.charge_id) {
      var idx = DB.chargen.findIndex(function(c){return c.id===p.charge_id;});
      if(idx>=0) {
        DB.chargen[idx].menge = p.ist;
        // BtM-Buch Korrekturbuchung
        if(a.btm) {
          var mId = Math.max.apply(null, DB.btm_buch.map(function(b){return b.id;}));
          var sl = DB.btm_buch.filter(function(b){return b.art_id===a.id;}).sort(function(x,y){return y.id-x.id;})[0];
          DB.btm_buch.push({id:mId+1,dat:inv.dat||'2026-07-22',typ:diff>0?'INVENTUR-ZUGANG':'INVENTUR-ABGANG',art_id:a.id,menge:Math.abs(diff),eh:a.einheit,beleg:inv.nr,charge_id:p.charge_id,saldo:(sl?sl.saldo:0)+diff,auto:false});
        }
      }
    }
    logAudit('INVENTURDIFFERENZ_GEBUCHT','buchungssatz',inv.nr,{soll:p.soll},{ist:p.ist,diff,betrag:Math.abs(diff)*(a.ek||7)});
    buchungen++;
  });
  toast('Inventur-Buchungssätze erstellt: '+buchungen+' Differenzpositionen in FiBu + BtM-Buch gebucht','success');
}

function vBilanz() {
  // Konten aus Buchungsjournal aggregieren
  var konten = {};
  DB.buchungen.forEach(function(b){
    konten[b.soll] = (konten[b.soll]||0) + b.betrag;
    konten[b.haben] = (konten[b.haben]||0) - b.betrag;
  });
  function kto(nr) { return konten[nr]||0; }

  // AKTIVA
  var bank         = (DB.bank_buchungen.length?[...DB.bank_buchungen].sort(function(a,b){return b.id-a.id;})[0].saldo_nach:DB.bank_saldo_anfang);
  var forderungen  = DB.vk_rechnungen.filter(function(r){return r.status==='OFFEN';}).reduce(function(s,r){return s+r.betrag;},0);
  var warenbestand = DB.chargen.filter(function(c){return c.status==='FREIGEGEBEN';}).reduce(function(s,c){return s+c.menge*(art(c.art_id).ek||7);},0);

/* ── SKONTO-BERECHNUNG ───────────────────────────────────── */
function parseZahlungsziel(zkz) {
  // "14/2% 30" → {skonto_tage:14, skonto_pct:2, netto_tage:30}
  // "30 Tage" → {netto_tage:30}
  // "14 Tage" → {netto_tage:14}
  var m = zkz.match(/(\d+)\/(\d+(?:\.\d+)?)%\s+(\d+)/);
  if(m) return {skonto_tage:parseInt(m[1]),skonto_pct:parseFloat(m[2]),netto_tage:parseInt(m[3])};
  var m2 = zkz.match(/(\d+)\s*Tage/);
  if(m2) return {netto_tage:parseInt(m2[1])};
  return {netto_tage:30};
}

function berechneSkonto(vrId) {
  var vr = DB.vk_rechnungen.find(function(r){return r.id===vrId;});
  if(!vr) return null;
  var k = kd(vr.kd_id);
  var zz = parseZahlungsziel(k.zkz||'30 Tage');
  if(!zz.skonto_pct) return null;
  var rechnungsDat = new Date(vr.dat);
  var skontoDat = new Date(rechnungsDat);
  skontoDat.setDate(skontoDat.getDate()+zz.skonto_tage);
  var nettoDat = new Date(rechnungsDat);
  nettoDat.setDate(nettoDat.getDate()+zz.netto_tage);
  var skontoBetrag = vr.betrag * zz.skonto_pct/100;
  var zahlBetrag = vr.betrag - skontoBetrag;
  var heute = new Date('2026-07-22');
  var skontoMoeglich = heute <= skontoDat;
  return {skonto_pct:zz.skonto_pct,skonto_tage:zz.skonto_tage,netto_tage:zz.netto_tage,skontoBetrag,zahlBetrag,skontoDat:skontoDat.toISOString().substring(0,10),nettoDat:nettoDat.toISOString().substring(0,10),skontoMoeglich};
}

function vKapazitaet() {
  var FAs = DB.fertigungsauftraege.slice().sort(function(a,b){return new Date(a.start)-new Date(b.start);});
  var baseDate = new Date('2026-07-20');
  var totalDays = 14;

  function dayOffset(dateStr) {
    return Math.max(0,Math.round((new Date(dateStr)-baseDate)/(1000*60*60*24)));
  }
  function daySpan(startStr, endStr) {
    return Math.max(1, Math.round((new Date(endStr)-new Date(startStr))/(1000*60*60*24))+1);
  }

  var html = '<div class="ib">ℹ️ <span><code>fertigungsauftrag</code> (cannos_schema_v8) · Kapazitätsplanung · 14-Tage-Vorschau · Auslastungsampel</span></div>';

  // Auslastung pro Tag berechnen
  var auslastung = [];
  for(var d=0;d<totalDays;d++) {
    var dayDate = new Date(baseDate);
    dayDate.setDate(dayDate.getDate()+d);
    var dayStr = dayDate.toISOString().substring(0,10);
    var aktive = FAs.filter(function(f){return f.start<=dayStr&&f.ende>=dayStr&&f.status!=='FERTIG';}).length;
    auslastung.push({day:dayStr.substring(5),pct:Math.min(100,aktive*40)});
  }

  html += '<div class="kpi-g">';
  html += '<div class="kpi b"><div class="kpi-l">Fertigungsaufträge</div><div class="kpi-v">'+FAs.length+'</div><div class="kpi-s">Gesamt</div></div>';
  html += '<div class="kpi a"><div class="kpi-l">In Produktion</div><div class="kpi-v">'+FAs.filter(function(f){return f.status==='IN_PRODUKTION';}).length+'</div><div class="kpi-s">Laufend</div></div>';
  html += '<div class="kpi g"><div class="kpi-l">Fertig</div><div class="kpi-v">'+FAs.filter(function(f){return f.status==='FERTIG';}).length+'</div><div class="kpi-s">Abgeschlossen</div></div>';
  html += '<div class="kpi p"><div class="kpi-l">Geplant</div><div class="kpi-v">'+FAs.filter(function(f){return f.status==='GEPLANT';}).length+'</div><div class="kpi-s">Noch nicht gestartet</div></div>';
  html += '</div>';

  // Auslastungsbalken
  html += '<div class="card"><div class="chd"><span class="cttl">📊 Kapazitäts-Auslastung – 14 Tage (20. Jul – 02. Aug 2026)</span></div><div class="cbd">';
  html += '<div style="display:flex;align-items:flex-end;gap:4px;height:80px;padding:0 4px">';
  auslastung.forEach(function(d){
    html += '<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1">';
    html += '<div style="width:100%;background:'+(d.pct>80?'#EF4444':d.pct>50?'#F59E0B':'#10B981')+';border-radius:3px 3px 0 0;height:'+Math.max(4,d.pct*0.65)+'px;transition:height .3s"></div>';
    html += '<div style="font-size:9px;color:#94A3B8">'+d.day+'</div>';
    html += '</div>';
  });
  html += '</div></div></div>';

  // Gantt-Chart
  html += '<div class="card"><div class="chd"><span class="cttl">📅 Gantt-Diagramm – Fertigungsaufträge</span></div><div class="cbd">';

  // Header Tage
  html += '<div style="display:flex;margin-bottom:8px;padding-left:160px">';
  for(var d=0;d<totalDays;d++) {
    var dd = new Date(baseDate); dd.setDate(dd.getDate()+d);
    var isWE = dd.getDay()===0||dd.getDay()===6;
    html += '<div style="flex:1;text-align:center;font-size:9px;color:'+(isWE?'#CBD5E1':'#64748B')+'">'+dd.getDate()+'.07'+'</div>';
  }
  html += '</div>';

  FAs.forEach(function(fa){
    var offset = dayOffset(fa.start);
    var span = daySpan(fa.start,fa.ende);
    var statusColors = {IN_PRODUKTION:'#2E7D32',GEPLANT:'#3B82F6',FERTIG:'#10B981'};
    html += '<div class="gantt-row">';
    html += '<div class="gantt-lbl" title="'+fa.nr+'">'+fa.nr.substring(0,12)+'<br><span style="font-size:9px;color:#94A3B8">'+fa.menge+' Stk</span></div>';
    html += '<div style="flex:1;background:#F1F5F9;border-radius:4px;height:28px;overflow:hidden;position:relative">';
    for(var d=0;d<totalDays;d++) {
      var dd2 = new Date(baseDate); dd2.setDate(dd2.getDate()+d);
      if(dd2.getDay()===0||dd2.getDay()===6) {
        html += '<div style="position:absolute;left:'+(d/totalDays*100)+'%;width:'+(1/totalDays*100)+'%;height:100%;background:#F8FAFC;border-right:1px solid #E2E8F0"></div>';
      }
    }
    html += '<div class="gantt-bar" style="left:'+(offset/totalDays*100)+'%;width:'+(span/totalDays*100)+'%;background:'+(statusColors[fa.status]||'#64748B')+'">';
    html += fa.status==='IN_PRODUKTION'?fa.fortschritt+'%':fa.status;
    html += '</div>';
    if(fa.status==='IN_PRODUKTION') {
      html += '<div style="position:absolute;left:'+(offset/totalDays*100)+'%;width:'+(span/totalDays*100*fa.fortschritt/100)+'%;height:100%;background:rgba(255,255,255,.25);border-radius:4px 0 0 4px"></div>';
    }
    html += '</div>';
    html += '<div style="width:28px;text-align:right;flex-shrink:0">'+statusBdg(fa.status).replace(/class="bdg /,'class="bdg ').replace(/>.*<\/span>/,'><\/span>')+'</div>';
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

/* ── SUPABASE KONFIGURATION ──────────────────────────────── */
var SUPABASE_CONFIG = {
  url: '',      // → eintragen: https://xxxx.supabase.co
  anon_key: '', // → eintragen: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  connected: false,
  user: null
};

// Supabase-Client (lightweight, ohne SDK)
var SB = {
  headers: function() {
    var h = {'Content-Type':'application/json','apikey':SUPABASE_CONFIG.anon_key};
    if(SUPABASE_CONFIG.user&&SUPABASE_CONFIG.user.access_token) h['Authorization']='Bearer '+SUPABASE_CONFIG.user.access_token;
    return h;
  },
  from: function(table) {
    var base = SUPABASE_CONFIG.url+'/rest/v1/'+table;
    return {
      select: function(cols) {
        return fetch(base+'?select='+(cols||'*'),{headers:SB.headers()}).then(function(r){return r.json();});
      },
      insert: function(data) {
        return fetch(base,{method:'POST',headers:Object.assign({'Prefer':'return=representation'},SB.headers()),body:JSON.stringify(Array.isArray(data)?data:[data])}).then(function(r){return r.json();});
      },
      update: function(data) {
        return {eq: function(col,val){
          return fetch(base+'?'+col+'=eq.'+val,{method:'PATCH',headers:Object.assign({'Prefer':'return=representation'},SB.headers()),body:JSON.stringify(data)}).then(function(r){return r.json();});
        }};
      },
      upsert: function(data) {
        return fetch(base,{method:'POST',headers:Object.assign({'Prefer':'return=representation,resolution=merge-duplicates'},SB.headers()),body:JSON.stringify(Array.isArray(data)?data:[data])}).then(function(r){return r.json();});
      }
    };
  },
  auth: {
    signIn: function(email, password) {
      return fetch(SUPABASE_CONFIG.url+'/auth/v1/token?grant_type=password',{
        method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_CONFIG.anon_key},
        body:JSON.stringify({email:email,password:password})
      }).then(function(r){return r.json();});
    },
    signOut: function() {
      return fetch(SUPABASE_CONFIG.url+'/auth/v1/logout',{method:'POST',headers:SB.headers()}).then(function(){SUPABASE_CONFIG.user=null;SUPABASE_CONFIG.connected=false;});
    }
  }
};

// Supabase Login
async function sbLogin(email, password) {
  if(!SUPABASE_CONFIG.url) { toast('Supabase URL nicht konfiguriert – Demo-Modus aktiv','info'); return; }
  try {
    var data = await SB.auth.signIn(email, password);
    if(data.error) { toast('Login fehlgeschlagen: '+data.error.message,'error'); return; }
    SUPABASE_CONFIG.user = data;
    SUPABASE_CONFIG.connected = true;
    S.loginScreen = false;
    toast('✓ Angemeldet als '+email+' (Supabase JWT)','success');
    await sbLadeStammdaten();
    draw();
  } catch(e) { toast('Verbindungsfehler: '+e.message,'error'); }
}

// Stammdaten aus Supabase laden
async function sbLadeStammdaten() {
  if(!SUPABASE_CONFIG.connected) return;
  try {
    var [artt, chargen, kunden] = await Promise.all([
      SB.from('artikel').select('*'),
      SB.from('artikel_charge').select('*'),
      SB.from('kunde').select('*')
    ]);
    if(Array.isArray(artt)&&artt.length) { DB.artikel=artt; toast('Artikel aus Supabase geladen ('+artt.length+')','info'); }
    if(Array.isArray(chargen)&&chargen.length) DB.chargen=chargen;
    if(Array.isArray(kunden)&&kunden.length) DB.kunden=kunden;
    draw();
  } catch(e) { toast('Fehler beim Laden: '+e.message,'error'); }
}

// Buchung in Supabase persistieren
async function sbPersistiereBuchung(tabelle, datensatz) {
  if(!SUPABASE_CONFIG.connected) return; // Demo-Modus: nur in-memory
  try {
    await SB.from(tabelle).insert(datensatz);
  } catch(e) { console.warn('Supabase persist error:', e); }
}

// Audit-Log in Supabase schreiben
var _origLogAudit = logAudit;
function logAudit(aktion, tabelle, datensatz_id, alteWerte, neueWerte) {
  var entry = _origLogAudit(aktion, tabelle, datensatz_id, alteWerte, neueWerte);
  if(SUPABASE_CONFIG.connected && entry) {
    sbPersistiereBuchung('audit_log', {
      aktion: entry.aktion, tabelle_name: entry.tabelle,
      datensatz_id: entry.datensatz_id, alte_werte: entry.alt,
      neue_werte: entry.neu, benutzer_id: SUPABASE_CONFIG.user?.user?.id,
      benutzer_kz: 'RP', ip_adresse: entry.ip
    });
  }
  return entry;
}
